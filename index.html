<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>YTMusic Desktop Settings</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="settings-shell">
      <header class="page-header">
        <p class="eyebrow">YTMusic Desktop</p>
        <h1>Settings</h1>
        <p class="subtitle">Customize how the app behaves on this computer.</p>
      </header>

      <section class="settings-card" aria-labelledby="shortcuts-heading">
        <div class="section-heading">
          <div>
            <h2 id="shortcuts-heading">Global shortcuts</h2>
            <p>Click a field, then press the shortcut you want to use.</p>
          </div>
          <button id="restore-defaults" class="secondary-button" type="button">
            Restore Defaults
          </button>
        </div>

        <div id="shortcut-list" class="shortcut-list" aria-busy="true"></div>
      </section>

      <div class="status-area" aria-live="polite" aria-atomic="true">
        <span id="status-indicator" class="status-indicator" aria-hidden="true"></span>
        <p id="status-message">Loading settings…</p>
      </div>
    </main>
  </body>
</html>
