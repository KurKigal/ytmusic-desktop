[[permission]]
identifier = "allow-settings-read"
description = "Allows the trusted local Settings window to read application settings."
commands.allow = ["get_settings"]

[[permission]]
identifier = "allow-shortcut-update"
description = "Allows the trusted local Settings window to replace one global playback shortcut."
commands.allow = ["update_shortcut"]

[[permission]]
identifier = "allow-shortcut-restore-defaults"
description = "Allows the trusted local Settings window to restore default global playback shortcuts."
commands.allow = ["restore_default_shortcuts"]
